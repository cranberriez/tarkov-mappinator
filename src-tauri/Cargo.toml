[package]
name = "tarkov-mappinator"
version = "0.1.0"
description = "Passive Tarkov file diagnostics"
edition = "2021"

[lib]
name = "tarkov_mappinator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = "3"
ts-rs = "11"
chrono = "0.4"
regex = "1"
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
