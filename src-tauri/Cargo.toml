[package]
name = "tarkov-mappinator"
version = "0.1.0"
description = "Passive Tarkov file diagnostics"
edition = "2021"

[lib]
name = "tarkov_mappinator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = "3"
ts-rs = "11"
chrono = "0.4"
regex = "1"
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"

# Thumbnail decoding is ~10x slower unoptimized; keep dev previews responsive.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
