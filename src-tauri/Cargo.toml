[package]
name = "tarkov-mappinator"
version = "0.1.0"
description = "Passive Tarkov file diagnostics"
edition = "2021"

[lib]
name = "tarkov_mappinator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ts-rs = "11"
chrono = "0.4"
regex = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
