name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # Version comes from src-tauri/tauri.conf.json; bump it before running to cut a new release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Tarkov Mappinator v__VERSION__
          releaseBody: See the assets below to download the installer.
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          releaseCommitish: ${{ github.sha }}
